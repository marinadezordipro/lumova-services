server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressão para textos e JS
    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # Cabeçalhos de segurança básicos
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Cache longo para assets estáticos versionados na pasta
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
    }

    # Cache curto para HTML (garante atualização rápida no deploy)
    location ~* \.html$ {
        expires 5m;
        add_header Cache-Control "public, must-revalidate" always;
    }

    # Fallback amigável (single-page fallback style)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Ocultar versão do Nginx
    server_tokens off;
}
