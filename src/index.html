<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LUMOVA · Site em preparação</title>
  <meta name="description" content="A LUMOVA está finalizando o novo site institucional. Contato pelo e-mail contato@lumova.com.br." />
  <meta name="robots" content="noindex, follow" />

  <link rel="icon" href="/assets/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/lumova_favicon_32x32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/lumova_favicon_180x180.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: radial-gradient(ellipse at top, #061A33 0%, #001226 65%);
      color: #F7FAFF;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem 1.5rem 5rem;
      text-align: center;
      position: relative;
    }
    .logo {
      max-width: 220px;
      width: 100%;
      margin-bottom: 3rem;
    }
    .badge {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.22em;
      color: #F07820;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
      font-weight: 500;
    }
    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 400;
      font-size: clamp(1.75rem, 4.5vw, 2.75rem);
      line-height: 1.2;
      margin-bottom: 1.5rem;
      letter-spacing: -0.015em;
      max-width: 18ch;
    }
    h1 .accent {
      color: #F07820;
    }
    p.subtitle {
      font-size: 1rem;
      color: rgba(247, 250, 255, 0.7);
      max-width: 42ch;
      line-height: 1.65;
      margin-bottom: 2.5rem;
    }
    .divider {
      width: 36px;
      height: 2px;
      background: #F07820;
      margin: 0 auto 2.5rem;
      opacity: 0.65;
    }
    .contact {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      align-items: center;
      margin-bottom: 3rem;
    }
    .contact-label {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      color: rgba(247, 250, 255, 0.4);
      text-transform: uppercase;
    }
    .contact a {
      color: #F7FAFF;
      text-decoration: none;
      font-size: 1.0625rem;
      font-weight: 500;
      border-bottom: 1px solid rgba(240, 120, 32, 0.55);
      padding-bottom: 2px;
      transition: border-color 0.2s ease, color 0.2s ease;
    }
    .contact a:hover, .contact a:focus {
      color: #F5921F;
      border-bottom-color: #F5921F;
    }
    .radar {
      font-size: 0.875rem;
      color: rgba(247, 250, 255, 0.55);
      max-width: 38ch;
      line-height: 1.55;
    }
    .radar a {
      color: #F5921F;
      text-decoration: none;
      font-weight: 500;
    }
    .radar a:hover, .radar a:focus {
      text-decoration: underline;
    }
    footer {
      position: absolute;
      bottom: 1.25rem;
      left: 0;
      right: 0;
      font-size: 0.7rem;
      color: rgba(247, 250, 255, 0.35);
      font-family: 'Space Grotesk', sans-serif;
      letter-spacing: 0.15em;
    }
  </style>
</head>
<body>
  <img src="/assets/lumova_horizontal_384x128.png" alt="LUMOVA" class="logo" />

  <div class="badge">Em preparação</div>

  <h1>Novo site institucional, <span class="accent">em breve</span>.</h1>

  <p class="subtitle">
    Estamos finalizando o site da LUMOVA. Enquanto isso, o contato segue direto por e-mail.
  </p>

  <div class="divider"></div>

  <div class="contact">
    <span class="contact-label">Contato</span>
    <a href="mailto:contato@lumova.com.br">contato@lumova.com.br</a>
  </div>

  <div class="radar">
    Conheça o <a href="https://radarcaptagov.com.br">Radar CaptaGov</a>, plataforma da LUMOVA para captação de recursos públicos.
  </div>

  <footer>© LUMOVA</footer>
</body>
</html>
