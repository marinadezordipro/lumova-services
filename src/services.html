  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    h1, h2, h3 { font-family: 'Space Grotesk', 'Inter', system-ui, sans-serif; }

    /* ── Fundo hero com gradiente de luz ── */
    .hero-bg {
      background:
        radial-gradient(ellipse 60% 50% at 80% 30%, rgba(75,125,255,0.14) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 20% 80%, rgba(240,120,32,0.10) 0%, transparent 60%),
        #001226;
    }

    /* ── Padrão de grade sutil ── */
    .grid-pattern {
      background-image:
        linear-gradient(rgba(75,125,255,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(75,125,255,0.05) 1px, transparent 1px);
      background-size: 64px 64px;
    }

    /* ── Cards de serviço – layout vertical interativo ── */
    .svc-card {
      position: relative;
      border: 1px solid #1E3252;
      background: #0F1E38;
      border-radius: 2px;
      overflow: hidden;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }
    /* Barra lateral colorida */
    .svc-card::after {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      transition: opacity 0.25s ease;
    }
    .svc-orange::after { background: linear-gradient(180deg, #F07820, #FAA040); }
    .svc-blue::after   { background: linear-gradient(180deg, #4B7DFF, #8BABFF); }

    .svc-orange:hover { border-color: rgba(240,120,32,0.35); box-shadow: 0 8px 40px rgba(240,120,32,0.07); }
    .svc-blue:hover   { border-color: rgba(75,125,255,0.35);  box-shadow: 0 8px 40px rgba(75,125,255,0.07); }

    /* Ícone de toggle ("+") */
    .svc-toggle {
      color: #8C95B8;
      transition: transform 0.35s cubic-bezier(0.4,0,0.2,1), color 0.2s ease;
      flex-shrink: 0;
    }

    /* Painel de detalhe – grid trick p/ transição suave de altura */
    .svc-detail {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.42s cubic-bezier(0.4,0,0.2,1);
    }
    .svc-detail-inner { overflow: hidden; }
    .svc-detail-body {
      opacity: 0;
      padding-top: 1.25rem;
      margin-top: 1.25rem;
      border-top: 1px solid #1E3252;
      transition: opacity 0.28s ease 0.08s;
    }

    /* Estado ativo: hover (desktop) */
    @media (hover: hover) {
      .svc-card:hover .svc-detail         { grid-template-rows: 1fr; }
      .svc-card:hover .svc-detail-body    { opacity: 1; }
      .svc-card:hover .svc-toggle         { transform: rotate(45deg); }
      .svc-orange:hover .svc-toggle       { color: #F07820; }
      .svc-blue:hover   .svc-toggle       { color: #4B7DFF; }
    }

    /* Estado ativo: click (mobile) */
    .svc-card.open .svc-detail      { grid-template-rows: 1fr; }
    .svc-card.open .svc-detail-body { opacity: 1; }
    .svc-card.open .svc-toggle      { transform: rotate(45deg); }
    .svc-orange.open .svc-toggle    { color: #F07820; }
    .svc-blue.open   .svc-toggle    { color: #4B7DFF; }

    /* ── Conector dos passos ── */
    .step-connector {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, #0D2540, #4B7DFF 50%, #0D2540);
      opacity: 0.35;
      margin-top: 2.4rem;
      flex-shrink: 0;
      min-width: 24px;
    }

    /* ── Animações de entrada ── */
    .fade-up {
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 0.65s ease, transform 0.65s ease;
    }
    .fade-up.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* ── Seção clara ── */
    .section-light {
      background: linear-gradient(180deg, #EDF2FF 0%, #F2F6FF 100%);
    }

    /* ── Cards da seção clara ── */
    .svc-card {
      background: #061A33;
      border-color: #0D2540;
    }
  </style>
</head>

  <script>
  (function () {

    function set(id, text) {
      const el = document.getElementById(id);
      if (el && text !== undefined) el.textContent = text;
    }
    function href(id, url) {
      const el = document.getElementById(id);
      if (el && url) el.setAttribute('href', url);
    }
    function buildList(id, items, accent) {
      const ul = document.getElementById(id);
      if (!ul || !items) return;
      const color = accent === 'blue' ? 'text-blue' : 'text-orange';
      ul.innerHTML = items.map(item => `
        <li class="flex items-start gap-2.5 text-sm text-muted">
          <span class="${color} mt-0.5 flex-shrink-0 font-bold">→</span>
          <span>${item}</span>
        </li>
      `).join('');
    }

    document.addEventListener('DOMContentLoaded', function () {

      // Nav
      set('nav-cta', C.nav.cta);
      href('nav-cta', C.nav.cta_href);

      // Hero
      set('hero-badge',     C.hero.badge);
      set('hero-h1',        C.hero.h1);
      set('hero-h2',        C.hero.h2);
      set('hero-sub',       C.hero.sub);
      set('hero-cta1-text', C.hero.cta1);
      set('hero-cta2-text', C.hero.cta2);
      href('hero-cta1',     C.hero.cta1_url);
      href('hero-cta2',     C.hero.cta2_url);

      // Seção serviços
      set('sec-badge',  C.secao_servicos.badge);
      set('sec-titulo', C.secao_servicos.titulo);
      set('sec-sub',    C.secao_servicos.sub);

      // Diagnóstico
      set('d-nome',     C.diagnostico.nome);
      set('d-tagline',  C.diagnostico.tagline);
      set('d-desc',     C.diagnostico.desc);
      set('d-cta-text', C.diagnostico.cta);
      buildList('d-lista', C.diagnostico.lista, 'orange');
      href('d-cta', C.diagnostico.cta_url);

      // Assessoria
      set('a-nome',     C.assessoria.nome);
      set('a-tagline',  C.assessoria.tagline);
      set('a-desc',     C.assessoria.desc);
      set('a-cta-text', C.assessoria.cta);
      buildList('a-lista', C.assessoria.lista, 'orange');
      href('a-cta', C.assessoria.cta_url);

      // Radar
      set('r-badge-el', C.radar.badge);
      set('r-nome',     C.radar.nome);
      set('r-tagline',  C.radar.tagline);
      set('r-desc',     C.radar.desc);
      set('r-cta-text', C.radar.cta);
      buildList('r-lista', C.radar.lista, 'blue');
      href('r-cta', C.radar.cta_url);

      // Como funciona
      set('cf-badge',  C.como_funciona.badge);
      set('cf-titulo', C.como_funciona.titulo);
      set('cf-sub',    C.como_funciona.sub);

      const passosEl = document.getElementById('passos-container');
      if (passosEl) {
        const passos = C.como_funciona.passos;
        passosEl.innerHTML = passos.map((p, i) => `
          <div class="flex-1 fade-up px-2 md:px-6 py-4" style="transition-delay:${0.1 + i * 0.15}s">
            <div class="text-6xl font-light mb-4 font-display" style="color:rgba(240,120,32,0.22)">${p.num}</div>
            <div class="w-8 h-px bg-orange mb-4"></div>
            <h3 class="text-xl font-medium text-snow mb-3">${p.nome}</h3>
            <p class="text-muted text-sm font-light leading-relaxed">${p.desc}</p>
          </div>
          ${i < passos.length - 1 ? '<div class="step-connector hidden md:block"></div>' : ''}
        `).join('');
        passosEl.querySelectorAll('.fade-up').forEach(el => observer.observe(el));
      }

      // CTA Final
      set('ctaf-titulo',   C.cta_final.titulo);
      set('ctaf-sub',      C.cta_final.sub);
      set('ctaf-btn-text', C.cta_final.btn);
      set('ctaf-sec-text', C.cta_final.sec);
      href('ctaf-btn', C.cta_final.btn_url);
      href('ctaf-sec', C.cta_final.sec_url);

      // Contato
      set('cont-titulo',     C.contato.titulo);
      set('cont-sub',        C.contato.sub);
      set('cont-wa-text',    C.contato.wa_texto);
      set('cont-email-text', C.contato.email);
      href('cont-wa',    C.contato.wa_url);
      href('cont-email', 'mailto:' + C.contato.email);

      // Footer
      set('footer-tagline', C.footer.tagline);
      set('footer-copy',    C.footer.copyright);

    });

    // Interação dos cards — clique em dispositivos sem hover
    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('.svc-card').forEach(card => {
        card.addEventListener('click', () => {
          if (!window.matchMedia('(hover: hover)').matches) {
            card.classList.toggle('open');
          }
        });
      });
    });

    // Nav — efeito ao rolar
    window.addEventListener('scroll', function () {
      const nav = document.getElementById('nav');
      if (window.scrollY > 40) {
        nav.style.background = 'rgba(0,18,38,0.94)';
        nav.style.backdropFilter = 'blur(14px)';
        nav.style.borderBottom = '1px solid #0D2540';
      } else {
        nav.style.background = '';
        nav.style.backdropFilter = '';
        nav.style.borderBottom = '';
      }
    });

    // Animações de entrada ao rolar
    const observer = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          e.target.classList.add('visible');
          observer.unobserve(e.target);
        }
      });
    }, { threshold: 0.1 });

    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));
    });

  })();
  </script>
