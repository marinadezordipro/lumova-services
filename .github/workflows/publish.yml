name: Build and deploy

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Define tag por branch
        id: tag
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            echo "tag=dev" >> $GITHUB_OUTPUT
          fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/marinadezordipro/lumova-services:${{ steps.tag.outputs.tag }}
            ghcr.io/marinadezordipro/lumova-services:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Portainer webhook
        run: |
          status=$(curl -sSL -o /dev/null -w "%{http_code}" -X POST "${{ secrets.PORTAINER_WEBHOOK }}")
          echo "HTTP status: $status"
          if [ "$status" != "204" ] && [ "$status" != "200" ]; then
            echo "❌ Webhook falhou (status $status)"
            exit 1
          fi
          echo "✅ Deploy trigger enviado. Portainer está atualizando o service lumova-services_site."
